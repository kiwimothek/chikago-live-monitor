name: TikTok LIVE Monitor

on:
  # Backup trigger. GitHub's cron can start late or not at all on new repos,
  # so the real 5-minute loop is the self-restart job at the bottom.
  schedule:
    - cron: "3-59/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write   # save live_state.json
  actions: write    # start the next run

# Prevent two monitoring runs from overlapping
concurrency:
  group: tiktok-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      start: ${{ steps.clock.outputs.start }}

    steps:

      - name: Record start time
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TikTok monitor
        run: python tiktok_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}

      - name: Save LIVE statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_state.json live_history.csv

          # Encrypted follower list; only exists once someone has used /follow
          if [ -f subscribers.enc ]; then
            git add subscribers.enc
          fi

          git diff --cached --quiet || (
            git commit -m "Update LIVE monitoring status"
            git pull --rebase --autostash -q origin main
            git push
          )

  # Starts the next run about 5 minutes after this one started.
  # Runs even if the monitor job failed, so one bad check cannot stop the loop.
  # It also runs after cron-triggered runs. GitHub keeps only the newest
  # waiting run per concurrency group, so a cron run can replace the run
  # this loop queued; if cron runs did not restart the loop, it would die
  # there (this is exactly what happened on 18 Nov at 23:11 UTC).
  next:
    needs: monitor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:

      - name: Wait for the next 5-minute slot
        env:
          START: ${{ needs.monitor.outputs.start }}
        run: |
          now=$(date +%s)
          start=${START:-$now}
          wait=$(( 270 - (now - start) ))
          if [ "$wait" -gt 0 ]; then
            sleep "$wait"
          fi

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry a few times so one failed API call cannot end the loop
          for attempt in 1 2 3; do
            if gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 15
          done
          exit 1
