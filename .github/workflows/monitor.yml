
name: TikTok LIVE Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

# Allow the bot to save its status file
permissions:
  contents: write

# Prevent two monitoring runs from overlapping
concurrency:
  group: tiktok-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TikTok monitor
        run: python tiktok_monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save LIVE statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_state.json

          git diff --cached --quiet || (
            git commit -m "Update LIVE monitoring status"
            git push
          )
